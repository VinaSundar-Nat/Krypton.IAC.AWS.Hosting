component:
  - sid: "kr-carevo"
    opt-in: true
    cluster :
      - name : kr-carevo-dev-cluster
        role : "kr-carevo-dev-cluster-role"
        # https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions.html
        # Maintain the Kubernetes version to the latest supported by EKS to ensure access to the latest features and security updates.
        # !!! Extended support is expensive - last bill us USD 25 for 1 cluster for 2.5 hours operational time for 1.31 in the 12 month window.
        version : "1.35"
        mode : "managed"
        subnets : [ "kr-carevo-dev-public-subnet-ect", 
                    "kr-carevo-dev-private-subnet-rst",
                    "kr-carevo-dev-private-subnet-ict" ]
        security_groups : [ ]
        endpoint_public_access : true
        endpoint_private_access : true
        nodegroup:
          - name: "kr-carevo-dev-ict-nodegroup"
            description: "Nodegroup for EKS cluster"
            role: "kr-carevo-dev-worker-nodegroup-role"
            template: "eks-node-group.json"
            subnets: [ "kr-carevo-dev-private-subnet-ict" ]
            template_parameters: 
              name: "kr-carevo-dev-ict-launchtemplate"
              name_prefix: "kr-carevo-dev-ict-template-"
              description: "Launch template for EKS cluster ict nodegroup"
              security_groups: ["kr-carevo-dev-app-ict-sg"]
              block_device_mappings: 
                 device_name: "/dev/xvda"
                 type: "ebs"
                 volume_size: 20
                 volume_type: "gp3"
                 delete_on_termination: true
                 encrypted: false
              monitoring: 
                enabled: true
              lifecycle: 
                create_before_destroy: false
              tags: 
                team: "Carevo DevOps Hosting"
            machine :
              instance_types: ["t4g.medium"] # "m6g.large" add only if fails to up spot t4g.medium
              ami_type: "AL2023_ARM_64_STANDARD"
              capacity_type: "SPOT"
            scaling_config:
              desired_size: 1
              max_size: 1
              min_size: 0
          - name: "kr-carevo-dev-rst-nodegroup"
            description: "Restricted Nodegroup for EKS cluster"
            role: "kr-carevo-dev-worker-nodegroup-role"
            template: "eks-node-group.json"
            subnets: [ "kr-carevo-dev-private-subnet-rst" ]
            template_parameters: 
              name: "kr-carevo-dev-rst-launchtemplate"
              name_prefix: "kr-carevo-dev-rst-template-"
              description: "Launch template for EKS cluster rst nodegroup"
              security_groups: ["kr-carevo-dev-app-rst-sg"]
              block_device_mappings: 
                 device_name: "/dev/xvda"
                 type: "ebs"
                 volume_size: 20
                 volume_type: "gp3"
                 delete_on_termination: true
                 encrypted: false
              monitoring: 
                enabled: true
              lifecycle: 
                create_before_destroy: false
              tags: 
                team: "Carevo DevOps Hosting"
            machine :
              instance_types: ["t4g.medium"] # "m6g.large" add only if fails to up spot t4g.medium
              ami_type: "AL2023_ARM_64_STANDARD"
              capacity_type: "SPOT"
            scaling_config:
              desired_size: 1
              max_size: 1
              min_size: 0
        namespace: 
          - name: "carevo-web-ict-ns"
            sid : "krce-web-01"
            description: "Namespace for Carevo internet facing Web applications"
            labels: 
              team: "Carevo-Web-Hosting"           
              environment: "dev"
              organization: "Krypton"
              program: "Carevo"
              application: "KrCE-Web"
              layer: "Web-Tier"
              zone: "ict"
              krce-prv-alb-associated: "false"
              krce-pub-alb-associated: "true"
          - name: "carevo-app-rst-ns"
            sid : "krce-api-01"
            description: "Namespace for Carevo restricted internal API's ( SOR , Domain)"
            labels: 
              team: "Carevo-APP-Hosting"
              environment: "dev"
              organization: "Krypton"
              program: "Carevo"
              application: "KrCE-Services"
              layer: "RST-Application-Tier"
              zone: "rst"
              krce-prv-alb-associated: "true"
              krce-pub-alb-associated: "false"
          - name: "carevo-app-ict-ns"
            sid : "krce-app-01"
            description: "Namespace for Carevo controlled internal API's ( Experience API's , Orchestrator / Orchestration API's)"
            labels: 
              team: "Carevo-APP-Hosting"              
              environment: "dev"
              organization: "Krypton"
              program: "Carevo"
              application: "KrCE-Backend"
              layer: "ICT-Application-Tier"
              zone: "ict"
              krce-prv-alb-associated: "true"
              krce-pub-alb-associated: "false"
          - name: "carevo-infra-ns"
            sid : "krce-infra-01"
            description: "Namespace for Carevo infrastructure components"
            labels: 
              team: "Krypton-Infra-Hosting"              
              environment: "dev"
              organization: "Krypton"
              program: "Carevo"
              application: "KrCE-Infra"
              layer: "Infra"
              zone: ""
              krce-prv-alb-associated: ""
              krce-pub-alb-associated: ""
        lbc:
          - name: "kr-carevo-dev-lbc"
            description: "Load Balancer Controller for EKS cluster"
            namespace: "kube-system"
            service_account:
              name: "kr-carevo-dev-lbc-sa"
              create: false
            

              
