component:
  - sid: "kr-carevo"
    global :
      policy :
        - name: "kr-carevo-dev-iam-viewer-policy"
          description: "IAM policy for EKS Viewer role"
          template: ""
          template_param: [
            {
              version: "2012-10-17",
              Effect: "Allow",
              Action: [
                "eks:ListFargateProfiles",
                "eks:DescribeNodegroup",
                "eks:ListNodegroups",
                "eks:ListUpdates",
                "eks:AccessKubernetesApi",
                "eks:ListAddons",
                "eks:DescribeCluster",
                "eks:DescribeAddonVersions",
                "eks:ListClusters",
                "eks:ListIdentityProviderConfigs",
                "iam:ListRoles"
              ],
              Resource: "*"
            },
            {
              version: "2012-10-17",
              Effect: "Allow",
              Action: [
                "ssm:GetParameter"
              ],
              Resource: "arn:aws:ssm:*:$${account_id}:parameter/*"
            }         
          ]
      group:
        - name: "kr-carevo-dev-iam-developer-group"
          description: "IAM group for EKS Developers"
          policies: ["kr-carevo-dev-iam-viewer-policy"]        
      user:
        - name: "bandit_dev"
          enabled: true
          description: "IAM user for EKS Developers"
          groups: ["kr-carevo-dev-iam-developer-group"]
        - name: "marlin_dev"
          enabled: true
          description: "IAM user for EKS Admins"
          groups: ["kr-carevo-dev-iam-developer-group"]
    cluster :
      - name : kr-carevo-dev-cluster
        role:
            - name: "kr-carevo-dev-cluster-role"
              description: "IAM role for EKS Cluster sts role - default trust for EKS service"
              json : {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Principal": {
                      "Service": "eks.amazonaws.com"
                    },
                    "Action": "sts:AssumeRole"
                  }
                ]
              }
              template: ""
        policy :
            - name: "kr-carevo-dev-cluster-policy"
              enabled: true
              description: "IAM policy for EKS Cluster Admin role"
              arns: ["arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"]
              roles: ["kr-carevo-dev-cluster-role"]
        access:
            - role_name: "krypton-hosting-tfl-runner"
              type: "role"
              description: "Local IAM Roles Anywhere deployer - full cluster admin"
              policy_arn: "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
              access_scope: "cluster"
            - role_name: "krypton-hosting-gha-exec"
              type: "role"
              description: "GitHub Actions OIDC deployer - full cluster admin"
              policy_arn: "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
              access_scope: "cluster"
    nodegroup :
      - name : "kr-carevo-dev-worker-nodegroup"
        role:
            - name: "kr-carevo-dev-worker-nodegroup-role"
              description: "IAM role for EKS Worker Nodegroup sts role - default trust for EC2 service"
              json : {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Service": "ec2.amazonaws.com"
                      },
                      "Action": "sts:AssumeRole"
                    }
                  ]
                }
              template: ""
        policy :
            - name: "kr-carevo-dev-worker-nodegroup-policy"
              enabled: true
              description: "IAM policy for EKS Worker Nodegroup role"
              arns: [ "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy", 
                      "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly", 
                      "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy",
                      "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore" ]
              roles: ["kr-carevo-dev-worker-nodegroup-role"]
    cluster_identity:
      - cluster: "kr-carevo-dev-cluster"
        roles:
          - name: "kr-carevo-dev-cluster-adm-role"
            sid: "adm-01"
            description: "IAM role for EKS Cluster Admin access via aws-auth configmap"         
            template:  {
              version: "2012-10-17",
              Effect: "Allow",
              Action: [
                "sts:AssumeRole"
              ],
              Principal: [
                 {
                   type: "AWS",
                   value: "arn:aws:iam::$${account_id}:root"
                 }
              ]              
            }
          - name: "kr-carevo-dev-cluster-lbc-role"
            sid: "lbc-01"
            description: "IAM role for EKS Cluster Load Balancer Controller"          
            template: {
              version: "2012-10-17",
              Effect: "Allow",
              Action: [
                "sts:AssumeRole",
                "sts:TagSession"
              ],
              Principal: [
                 {
                   type: "Service",
                   value: "pods.eks.amazonaws.com"
                 }
              ]
            }
        groups:
          - name: "kr-carevo-dev-cluster-adm-group"
            assume_role: "adm-01"
            users:
              - name: "blistering_barnacles"
                enabled: true
                force_destroy: true
                namespace: ""
                policy_arn: "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
                k8group: ["system:masters"]
                description: "IAM user for EKS Admins"
              - name: "mille_sabords"
                enabled: true
                force_destroy: true
                namespace: ""
                policy_arn: "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
                k8group: ["system:masters"]
                description: "IAM user for EKS Admins"
        pod_identity:
          required: true
          roles:
            - role: "lbc-01"  
              policy:
                - template_location: "loadbalancer.json"
                  name: "kr-carevo-dev-lbc-pod-identity-policy"                 
              description: "IAM role policy mapping to EKS POD Identity for Load Balancer Controller"
              service_account:
                name: "kr-carevo-dev-lbc-sa"
                namespace: "kube-system"

      
